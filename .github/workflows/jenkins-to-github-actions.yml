name: CI/CD (Jenkins Migration)

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ENV:
        required: false
        type: choice
        description: 'Target environment'
        options:
          - dev
          - test
          - prod
        default: dev
      RUN_SONAR:
        required: false
        type: boolean
        description: 'Run SonarQube scan + quality gate'
        default: true
      BUILD_DOCKER:
        required: false
        type: boolean
        description: 'Build & push Docker image'
        default: true

jobs:
  checkout:
    name: Checkout Source
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.get_sha.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Short SHA
        id: get_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: checkout
    runs-on: ubuntu-latest
    env:
      APP_NAME: sample-app
      REGISTRY: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
      IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.APP_NAME }}
      IMAGE_TAG: ${{ github.ref_name }}-${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Project
        run: |
          set -e
          echo "Building..."
          if [ -f package.json ]; then
            npm ci
            npm run build
          elif [ -f pom.xml ]; then
            mvn -B -DskipTests clean package
          elif [ -f requirements.txt ]; then
            python -m venv .venv
            . .venv/bin/activate
            pip install -U pip
            pip install -r requirements.txt
          else
            echo "No recognized build file found. Add your build commands."
          fi

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Tests
        run: |
          set -e
          echo "Testing..."
          if [ -f package.json ]; then
            npm test || true
          elif [ -f pom.xml ]; then
            mvn -B test
          elif [ -d .venv ] || [ -f requirements.txt ]; then
            [ -d .venv ] && . .venv/bin/activate || true
            pytest -q || true
          else
            echo "No tests configured."
          fi

  sonar:
    name: SonarQube Scan
    needs: test
    if: ${{ github.event.inputs.RUN_SONAR == 'true' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_LOGIN: ${{ secrets.SONAR_AUTH_TOKEN }}
        run: |
          set -e
          echo "Running SonarQube scan..."
          sonar-scanner \
            -Dsonar.projectKey=sample-app \
            -Dsonar.projectName=sample-app \
            -Dsonar.sources=. \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_LOGIN

  docker:
    name: Docker Build & Push
    needs: sonar
    if: ${{ github.event.inputs.BUILD_DOCKER == 'true' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      APP_NAME: sample-app
      REGISTRY: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
      IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.APP_NAME }}
      IMAGE_TAG: ${{ github.ref_name }}-${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin $REGISTRY
      - name: Docker Build & Push
        run: |
          docker build -t $IMAGE_REPO:$IMAGE_TAG .
          docker push $IMAGE_REPO:$IMAGE_TAG
          echo "Pushed: $IMAGE_REPO:$IMAGE_TAG"

  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    env:
      APP_NAME: sample-app
      ENV: ${{ github.event.inputs.ENV || 'dev' }}
      REGISTRY: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
      IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.APP_NAME }}
      IMAGE_TAG: ${{ github.ref_name }}-${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy
        run: |
          set -e
          echo "Deploying to $ENV..."
          echo "Example: kubectl -n $ENV set image deploy/$APP_NAME $APP_NAME=$IMAGE_REPO:$IMAGE_TAG"

  cleanup:
    name: Cleanup Workspace
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Docker Cleanup
        run: docker system prune -f || true
      - name: Remove workspace files
        run: |
          sudo rm -rf ./* || true
